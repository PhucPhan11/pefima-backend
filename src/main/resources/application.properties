spring.application.name=pefima-backend

# The API serves personal finance data: listen on this machine only.
server.address=127.0.0.1

# Swagger UI at http://localhost:8080/swagger-ui.html, OpenAPI JSON at /v3/api-docs.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Read-only notion_cleanup SQLite database from pefima-data (git-ignored there).
# Leave unset to start without the SQLite data source.
#pefima.source.sqlite.path=../pefima-data/exports/clean/notion-clean.sqlite3

# Local, git-ignored settings that must not be committed (such as real holdings).
spring.config.import=optional:file:./pefima-local.properties

# Gold valuation at PNJ's current buy price (GET /api/market/gold). Set the quantity
# in pefima-local.properties to enable it; without it the app makes no outbound call.
#pefima.gold.quantity-chi=1
#pefima.gold.product-code=N24K
#pefima.gold.cache-ttl=15m

# Vietcombank exchange rates for foreign-currency wallets (GET /api/market/fx-rates).
# Set the currencies in pefima-local.properties to enable it.
#pefima.fx.currencies=USD,EUR
#pefima.fx.cache-ttl=15m
